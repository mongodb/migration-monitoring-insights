name: Migration Insights Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          tag_name="${GITHUB_REF_NAME}"
          version="${tag_name#v}"
          if [[ -z "${version}" ]]; then
            echo "ERROR: Could not resolve version from tag (got ${GITHUB_REF})." >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "Release version: ${version} (tag: ${tag_name})"

      - name: Verify tag matches APP_VERSION
        shell: bash
        run: |
          tag_version="${{ steps.version.outputs.version }}"
          app_version=$(python3 -c "
          import re, pathlib
          text = pathlib.Path('lib/app_config.py').read_text()
          m = re.search(r'APP_VERSION\s*=\s*\"([^\"]+)\"', text)
          print(m.group(1) if m else '')
          ")
          if [[ -z "${app_version}" ]]; then
            echo "ERROR: Could not read APP_VERSION from lib/app_config.py" >&2
            exit 1
          fi
          if [[ "${tag_version}" != "${app_version}" ]]; then
            echo "ERROR: Tag ${tag_version} must match APP_VERSION (${app_version}) in lib/app_config.py" >&2
            exit 1
          fi
          echo "APP_VERSION matches tag: ${app_version}"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -q

  build-macos-arm64:
    needs: test
    runs-on: macos-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Build macOS arm64 binary
        run: |
          chmod +x build_macos.sh
          ./build_macos.sh --arch arm64

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-arm64
          path: dist/migration-monitoring-insights-${{ needs.test.outputs.version }}-macos-arm64
          if-no-files-found: error

  # Built on Ubuntu 20.04 (container) so one .deb covers 20.04 / 22.04 / 24.04.
  # Host runner is ubuntu-latest because the ubuntu-20.04 GitHub runner image is retired.
  # Python 3.11 is built from source: Focal is EOL and deadsnakes no longer ships packages.
  build-ubuntu-amd64:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    env:
      PYTHON_VERSION: "3.11.17"
    container:
      image: ubuntu:20.04
      env:
        DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Cache Python 3.11 install
        id: cache-python
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local
          key: ubuntu20-python-${{ env.PYTHON_VERSION }}-v1

      - name: Install Python 3.11 and build prerequisites
        working-directory: /
        run: |
          apt-get update
          apt-get install -y \
            ca-certificates curl git \
            build-essential \
            libssl-dev zlib1g-dev libffi-dev libsqlite3-dev \
            libreadline-dev libbz2-dev liblzma-dev libncurses-dev xz-utils \
            ruby ruby-dev rubygems
          if [[ ! -x /usr/local/bin/python3.11 ]]; then
            curl -fsSL "https://www.python.org/ftp/python/${PYTHON_VERSION}/Python-${PYTHON_VERSION}.tgz" \
              | tar -xz -C /tmp
            cd "/tmp/Python-${PYTHON_VERSION}"
            ./configure --prefix=/usr/local --with-ensurepip=install
            make -j"$(nproc)"
            make altinstall
          fi
          update-alternatives --install /usr/bin/python3 python3 /usr/local/bin/python3.11 1
          gem install fpm --no-document

      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Build Ubuntu amd64 package
        run: |
          chmod +x build_ubuntu.sh
          ./build_ubuntu.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ubuntu-amd64
          path: dist/migration-monitoring-insights_${{ needs.test.outputs.version }}-1.ubuntu_amd64.deb
          if-no-files-found: error

  build-amazonlinux-x86_64:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    container:
      image: amazonlinux:2023
    steps:
      - name: Install build prerequisites
        working-directory: /
        run: |
          dnf install -y \
            git tar gzip gcc rpm-build ruby rubygems \
            python3.11 python3.11-pip
          alternatives --install /usr/bin/python3 python3 /usr/bin/python3.11 1
          gem install fpm

      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Build Amazon Linux x86_64 package
        run: |
          chmod +x build_amazonlinux.sh
          ./build_amazonlinux.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: amazonlinux-x86_64
          path: dist/migration-monitoring-insights-${{ needs.test.outputs.version }}-1.amzn.x86_64.rpm
          if-no-files-found: error

  build-amazonlinux-aarch64:
    needs: test
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      actions: write
    container:
      image: amazonlinux:2023
    steps:
      - name: Install build prerequisites
        working-directory: /
        run: |
          dnf install -y \
            git tar gzip gcc rpm-build ruby rubygems \
            python3.11 python3.11-pip
          alternatives --install /usr/bin/python3 python3 /usr/bin/python3.11 1
          gem install fpm

      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Build Amazon Linux aarch64 package
        run: |
          chmod +x build_amazonlinux.sh
          ./build_amazonlinux.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: amazonlinux-aarch64
          path: dist/migration-monitoring-insights-${{ needs.test.outputs.version }}-1.amzn.aarch64.rpm
          if-no-files-found: error

  build-rhel8-x86_64:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    container:
      image: rockylinux:8
    steps:
      - name: Install build prerequisites
        working-directory: /
        run: |
          dnf install -y \
            git tar gzip gcc rpm-build ruby rubygems \
            python3.11 python3.11-pip
          alternatives --install /usr/bin/python3 python3 /usr/bin/python3.11 1
          gem install fpm -v 1.16.0 --no-document

      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Build RHEL 8 x86_64 package
        run: |
          chmod +x build_rhel.sh
          ./build_rhel.sh --el-major 8

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rhel8-x86_64
          path: dist/migration-monitoring-insights-${{ needs.test.outputs.version }}-1.el8.x86_64.rpm
          if-no-files-found: error

  build-rhel9-x86_64:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    container:
      image: rockylinux:9
    steps:
      - name: Install build prerequisites
        working-directory: /
        run: |
          dnf install -y \
            git tar gzip gcc rpm-build ruby rubygems \
            python3.11 python3.11-pip
          alternatives --install /usr/bin/python3 python3 /usr/bin/python3.11 1
          gem install fpm

      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Build RHEL 9 x86_64 package
        run: |
          chmod +x build_rhel.sh
          ./build_rhel.sh --el-major 9

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rhel9-x86_64
          path: dist/migration-monitoring-insights-${{ needs.test.outputs.version }}-1.el9.x86_64.rpm
          if-no-files-found: error

  # Publish whatever platform builds succeeded. Failed builds do not block the release.
  release:
    needs:
      - test
      - build-macos-arm64
      - build-ubuntu-amd64
      - build-amazonlinux-x86_64
      - build-amazonlinux-aarch64
      - build-rhel8-x86_64
      - build-rhel9-x86_64
    if: >-
      always()
      && needs.test.result == 'success'
      && (
        needs.build-macos-arm64.result == 'success'
        || needs.build-ubuntu-amd64.result == 'success'
        || needs.build-amazonlinux-x86_64.result == 'success'
        || needs.build-amazonlinux-aarch64.result == 'success'
        || needs.build-rhel8-x86_64.result == 'success'
        || needs.build-rhel9-x86_64.result == 'success'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Download available build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: List release assets
        run: find artifacts -type f | sort

      - name: Render release notes
        env:
          VERSION: ${{ needs.test.outputs.version }}
          RESULT_MACOS_ARM64: ${{ needs.build-macos-arm64.result }}
          RESULT_UBUNTU_AMD64: ${{ needs.build-ubuntu-amd64.result }}
          RESULT_AMZN_X86_64: ${{ needs.build-amazonlinux-x86_64.result }}
          RESULT_AMZN_AARCH64: ${{ needs.build-amazonlinux-aarch64.result }}
          RESULT_RHEL8_X86_64: ${{ needs.build-rhel8-x86_64.result }}
          RESULT_RHEL9_X86_64: ${{ needs.build-rhel9-x86_64.result }}
        run: |
          set -euo pipefail
          body=/tmp/release-body.md
          sed "s/<version>/${VERSION}/g" ci/RELEASE_DOWNLOADS.md > "${body}"

          # Drop download-table rows for assets that were not produced.
          drop_row_if_missing() {
            local pattern="$1"
            if ! find artifacts -type f -name "${pattern}" | grep -q .; then
              grep -v -F "\`${pattern}\`" "${body}" > "${body}.tmp"
              mv "${body}.tmp" "${body}"
            fi
          }

          drop_row_if_missing "migration-monitoring-insights-${VERSION}-macos-arm64"
          drop_row_if_missing "migration-monitoring-insights_${VERSION}-1.ubuntu_amd64.deb"
          drop_row_if_missing "migration-monitoring-insights-${VERSION}-1.amzn.x86_64.rpm"
          drop_row_if_missing "migration-monitoring-insights-${VERSION}-1.amzn.aarch64.rpm"
          drop_row_if_missing "migration-monitoring-insights-${VERSION}-1.el8.x86_64.rpm"
          drop_row_if_missing "migration-monitoring-insights-${VERSION}-1.el9.x86_64.rpm"

          failed=()
          [[ "${RESULT_MACOS_ARM64}" == "success" ]] || failed+=("macOS Apple Silicon (${RESULT_MACOS_ARM64})")
          [[ "${RESULT_UBUNTU_AMD64}" == "success" ]] || failed+=("Ubuntu amd64 (${RESULT_UBUNTU_AMD64})")
          [[ "${RESULT_AMZN_X86_64}" == "success" ]] || failed+=("Amazon Linux x86_64 (${RESULT_AMZN_X86_64})")
          [[ "${RESULT_AMZN_AARCH64}" == "success" ]] || failed+=("Amazon Linux aarch64 (${RESULT_AMZN_AARCH64})")
          [[ "${RESULT_RHEL8_X86_64}" == "success" ]] || failed+=("RHEL 8 x86_64 (${RESULT_RHEL8_X86_64})")
          [[ "${RESULT_RHEL9_X86_64}" == "success" ]] || failed+=("RHEL 9 x86_64 (${RESULT_RHEL9_X86_64})")

          if ((${#failed[@]} > 0)); then
            {
              echo ""
              echo "### Missing platforms"
              echo ""
              echo "These platform builds did not succeed in this run; their assets are not attached:"
              echo ""
              for item in "${failed[@]}"; do
                echo "- ${item}"
              done
            } >> "${body}"
          fi

          echo "---- release body ----"
          cat "${body}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: /tmp/release-body.md
          files: artifacts/**
